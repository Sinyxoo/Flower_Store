server.port=8080

# База данных. Логин и пароль можно переопределить переменными окружения
# (DB_URL / DB_USER / DB_PASSWORD) — тогда в файле ничего секретного хранить не нужно.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/flowerstore}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:123}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# SQL-скрипты из db/ запускаются вручную (psql), приложение их не выполняет.
spring.sql.init.mode=never

# Администратор, который создаётся при первом запуске.
app.admin.email=${ADMIN_EMAIL:admin@flower.local}
app.admin.password=${ADMIN_PASSWORD:admin123}
