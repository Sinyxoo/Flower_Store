<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Контакты — Flower Store</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="contacts" >
<div id="site-header"></div>
<main class="container">
  <h1>Контакты</h1>
  <div class="split">
    <div>
      <p><b>Адрес:</b> г. Минск, пр. Независимости, 10</p>
      <p><b>Телефон:</b> +375 29 000-00-00</p>
      <p><b>E-mail:</b> info@flowerstore.local</p>
      <p class="muted">Ежедневно с 9:00 до 21:00</p>
    </div>
    <form class="form" method="post" action="/contacts">
      <h3 style="margin-bottom:14px">Написать нам</h3>
      <div class="field"><label for="name">Ваше имя</label><input id="name" name="name"></div>
      <div class="field"><label for="contact">E-mail или телефон</label><input id="contact" name="contact"></div>
      <div class="field"><label for="message">Сообщение</label><textarea id="message" name="message" rows="4" required></textarea></div>
      <button class="btn">Отправить</button>
    </form>
  </div>
</main>
<div id="site-footer"></div>
<script src="/js/common.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/pages.js"></script>
</body>
</html>
