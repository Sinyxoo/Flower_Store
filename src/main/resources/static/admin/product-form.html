<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Товар — Flower Store</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="products" data-load="productForm" data-admin>
<div id="site-header"></div>
<div class="admin">
  <aside class="side" id="side"></aside>
  <main>
    <h1 id="title">Новый товар</h1>
    <form class="form" method="post" action="/admin/products/save">
      <input type="hidden" name="id" id="pid">
      <div class="field"><label for="name">Название</label><input id="name" name="name" required></div>
      <div class="field"><label for="categoryId">Категория</label><select id="categoryId" name="categoryId"></select></div>
      <div class="field"><label for="price">Цена, Br</label><input id="price" name="price" type="number" step="0.01" required></div>
      <div class="field"><label for="stock">Остаток на складе, шт.</label><input id="stock" name="stock" type="number" value="0" required></div>
      <div class="field"><label for="description">Описание</label><textarea id="description" name="description" rows="3"></textarea></div>
      <div class="field"><label for="imageUrl">Ссылка на изображение</label><input id="imageUrl" name="imageUrl"></div>
      <div class="field check"><input type="checkbox" name="visible" id="visible" checked><label for="visible" style="margin:0">Показывать на сайте</label></div>
      <div class="row"><button class="btn">Сохранить</button><a class="btn line" href="/admin/products.html">Отмена</a></div>
    </form>
  </main>
</div>
<script src="/js/common.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/pages.js"></script>
</body>
</html>
