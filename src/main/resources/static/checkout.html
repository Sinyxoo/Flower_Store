<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Оформление заказа — Flower Store</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="cart" data-load="checkout" >
<div id="site-header"></div>
<main class="container">
  <h1>Оформление заказа</h1>
  <div id="empty" class="empty" hidden>
    <div class="big">🛒</div>
    <p>Корзина пуста — оформлять пока нечего.</p>
    <a class="btn" href="/catalog.html">В каталог</a>
  </div>
  <div class="split" id="checkout">
    <form class="form" method="post" action="/checkout">
      <div class="field"><label for="n">Имя</label><input id="n" name="customerName" required></div>
      <div class="field"><label for="e">E-mail</label><input id="e" name="email" type="email"></div>
      <div class="field"><label for="t">Телефон</label><input id="t" name="phone"></div>
      <div class="field"><label for="a">Адрес доставки</label><input id="a" name="address" required></div>
      <div class="field">
        <label for="pm">Способ оплаты</label>
        <select id="pm" name="payment">
          <option value="cash">Наличными курьеру</option>
          <option value="card">Картой курьеру</option>
          <option value="online">Онлайн (условно)</option>
        </select>
      </div>
      <button class="btn pink">Подтвердить заказ</button>
    </form>
    <div>
      <h3>Ваш заказ</h3>
      <div class="tbox" style="margin-top:12px"><table id="sum"></table></div>
      <div class="total" id="total"></div>
    </div>
  </div>
</main>
<div id="site-footer"></div>
<script src="/js/common.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/pages.js"></script>
</body>
</html>
