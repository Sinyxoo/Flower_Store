# Настройки ТЕСТОВ. Этот файл перекрывает src/main/resources/application.properties,
# поэтому во время `mvn test` приложение работает на встроенной H2,
# а настоящая база PostgreSQL (flowerstore) не затрагивается.
spring.datasource.url=jdbc:h2:mem:flowerstore-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.sql.init.mode=never

# Администратор для тестов
app.admin.email=admin@flower.local
app.admin.password=admin123
